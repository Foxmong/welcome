<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>에이전트 현황 대시보드</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #171a23;
    --border: #2a2e3a;
    --text: #e6e8ef;
    --muted: #8a8fa3;
    --accent: #6d8bff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 32px;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  .summary {
    display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap;
  }
  .summary .pill {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 999px; padding: 6px 14px; font-size: 13px; color: var(--muted);
  }
  .summary .pill b { color: var(--text); }
  table { width: 100%; border-collapse: collapse; background: var(--card);
          border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  th, td { padding: 12px 14px; text-align: left; font-size: 14px; }
  th { color: var(--muted); font-weight: 500; border-bottom: 1px solid var(--border); }
  tbody tr { border-bottom: 1px solid var(--border); }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #1c2030; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .badge {
    display: inline-block; padding: 3px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 600;
  }
  .badge.run   { background: #1e3a2e; color: #6fe19a; }
  .badge.idle  { background: #2a2e3a; color: #8a8fa3; }
  .badge.done  { background: #1e2c3a; color: #6db8ff; }
  .badge.err   { background: #3a1e1e; color: #ff8080; }
  .empty, .error {
    padding: 40px; text-align: center; color: var(--muted);
    background: var(--card); border: 1px dashed var(--border); border-radius: 10px;
  }
  .error { color: #ff8080; }
  code { background: #1c2030; padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>
  <h1>Cursor Cloud Agent 현황</h1>
  <div class="sub">{{ refresh_seconds }}초마다 자동 새로고침 · Codex 등 다른 도구의 에이전트는 표시되지 않습니다</div>

  <div class="summary" id="summary"></div>
  <div id="content">불러오는 중...</div>

  <script>
    const REFRESH_MS = {{ refresh_seconds }} * 1000;

    function statusClass(status) {
      if (["ACTIVE", "RUNNING", "CREATING"].includes(status)) return "run";
      if (["FINISHED"].includes(status)) return "done";
      if (["ERROR", "CANCELLED", "EXPIRED"].includes(status)) return "err";
      return "idle";
    }

    function fmtTime(iso) {
      if (!iso) return "-";
      const d = new Date(iso);
      return d.toLocaleString("ko-KR", { hour12: false });
    }

    async function loadAgents() {
      const content = document.getElementById("content");
      const summary = document.getElementById("summary");
      try {
        const res = await fetch("/api/agents");
        const data = await res.json();

        if (!res.ok) {
          content.innerHTML = `<div class="error">오류: ${data.error}</div>`;
          summary.innerHTML = "";
          return;
        }

        const agents = data.agents || [];
        const running = agents.filter(a => statusClass(a.status) === "run").length;

        summary.innerHTML = `
          <div class="pill">전체 <b>${agents.length}</b>개</div>
          <div class="pill">실행 중 <b>${running}</b>개</div>
        `;

        if (agents.length === 0) {
          content.innerHTML = `<div class="empty">현재 조회되는 에이전트가 없습니다.</div>`;
          return;
        }

        const rows = agents.map(a => `
          <tr>
            <td><a href="${a.url}" target="_blank">${a.name}</a></td>
            <td><span class="badge ${statusClass(a.status)}">${a.statusLabel}</span></td>
            <td>${a.repo || "-"}</td>
            <td>${a.branch ? `<code>${a.branch}</code>` : "-"}</td>
            <td>${a.prUrl ? `<a href="${a.prUrl}" target="_blank">PR 보기</a>` : "-"}</td>
            <td>${fmtTime(a.updatedAt)}</td>
          </tr>
        `).join("");

        content.innerHTML = `
          <table>
            <thead>
              <tr>
                <th>이름</th><th>상태</th><th>저장소</th><th>브랜치</th><th>PR</th><th>마지막 업데이트</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        `;
      } catch (e) {
        content.innerHTML = `<div class="error">불러오기 실패: ${e}</div>`;
      }
    }

    loadAgents();
    setInterval(loadAgents, REFRESH_MS);
  </script>
</body>
</html>
